set -g default-terminal "tmux-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/personal/dev/todo.md"

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Required: Set the theme variant (choose 'main', 'dawn', or 'moon')
set -g @rose_pine_variant 'main'

# Optional customizations (uncomment/add as needed)
set -g @rose_pine_disable_active_window_menu 'on' # Disables the menu that shows the active window on the left
# set -g @rose_pine_user 'on'  # Show username
# set -g @rose_pine_host 'on'  # Show hostname
# set -g @rose_pine_date_time '%Y-%m-%d %H:%M'  # Show date/time
set -g @rose_pine_directory 'on'  # Show current directory
set -g @rose_pine_bar_bg_disable 'on'  # For transparent status bar
set -g @rose_pine_show_current_program 'on'  # Show program in window status

run-shell "~/.config/tmux/themes/rose-pine.tmux"
